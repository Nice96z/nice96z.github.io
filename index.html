<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Futuristic Color Picker</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/mediaQueries.css">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/themes.css">
    <link rel="stylesheet" href="./css/utilites.css">
    <link rel="stylesheet" href="./css/variables.css">
    <style>
        .color-picker {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        .section-container {
            margin-bottom: 20px;
        }
        @media (min-width: 768px) {
            .color-picker {
                flex-direction: row;
                justify-content: space-between;
            }
            .main-section, .combined-selections-section, .combined-controls-section {
                flex: 1;
                margin: 10px;
            }
        }
    </style>
</head>
<body class="light-mode">
  <main class="color-picker container">
    <div class="hamburger-menu mb-3">
        <button id="hamburger-icon" aria-label="Toggle Menu" class="btn btn-outline-primary">
            ☰
        </button>
        <div id="minimized-tabs" class="minimized-tabs-container d-none" aria-hidden="true">
            <!-- Minimized tabs will go here -->
        </div>
    </div>
    <h1 class="color-picker-title">Futuristic Color Picker</h1>

    <section class="main-section section-container">
      <canvas id="color-wheel" class="color-wheel" role="region" aria-label="Color Selection Area" tabindex="0"></canvas>
      <div class="preview-box" id="preview" aria-live="polite"></div>
    </section>
    
    <div id="loading" class="loading-indicator d-none" aria-live="polite">Loading...</div>

    <section class="combined-selections-section section-container">
        <div class="section-header">
            <h2 class="section-title">Color Management</h2>
            <button class="btn btn-outline-secondary minimize-button" aria-label="Minimize Color Management">−</button>
            <button class="btn btn-outline-secondary maximize-button" aria-label="Maximize Color Management">+</button>
        </div>
        <div class="combined-selections-inner">
            <section class="color-display-section section-container">
                <div class="section-header">
                    <h2 class="section-title">Selected Color</h2>
                    <button class="btn btn-outline-secondary minimize-button" aria-label="Minimize Selected Color">−</button>
                </div>
                <div id="color-display">
                    <p>HSL: <span id="hsl-value"></span></p>
                    <p>Hex: <span id="hex-value"></span></p>
                    <p>RGB: <span id="rgb-value"></span></p>
                </div>
            </section>

            <section class="color-selections section-container">
                <div class="section-header">
                    <h2 class="section-title">Color Selection</h2>
                    <button class="btn btn-outline-secondary minimize-button" aria-label="Minimize Color Selection">−</button>
                </div>
                <div role="radiogroup" aria-label="Select Active Color">
                    <div class="selection active mb-3" id="selection-1">
                        <input type="radio" id="color1-radio" name="active-color" value="#ff0000" aria-label="Color 1" checked />
                        <label for="color1-radio">Select Color 1:</label>
                        <input type="color" id="color1" value="#ff0000" aria-label="Set Color 1" />
                    </div>
                    <div class="selection mb-3" id="selection-2">
                        <input type="radio" id="color2-radio" name="active-color" value="#0000ff" aria-label="Color 2" />
                        <label for="color2-radio">Select Color 2:</label>
                        <input type="color" id="color2" value="#0000ff" aria-label="Set Color 2" />
                    </div>
                </div>
                <div class="recent-colors-section" id="recent-colors">
                    <h3 class="sub-section-title">Recent Colors</h3>
                    <ul id="recent-colors-container" role="list" aria-label="Recent Colors"></ul>
                    <div class="control-row">
                        <label for="maxRecentColors">Maximum Recent Colors:</label>
                        <input type="number" id="maxRecentColors" value="5" min="1" max="20" aria-label="Maximum number of recent colors to store"/>
                    </div>
                </div>
            </section>
        </div>
    </section>

    <section class="combined-controls-section section-container">
        <div class="section-header">
            <h2 class="section-title">Combined Color Controls</h2>
            <button class="btn btn-outline-secondary minimize-button" aria-label="Minimize Combined Controls">−</button>
            <button class="btn btn-outline-secondary maximize-button" aria-label="Maximize Color Management">+</button>
        </div>
        <div class="combined-controls-inner">
            <section class="color-adjustment-section section-container">
                <div class="section-header">
                    <h2 class="section-title">Color Adjustment</h2>
                    <button class="btn btn-outline-secondary minimize-button" aria-label="Minimize Color Adjustment">−</button>
                </div>
                <fieldset>
                    <legend>Adjust Color Properties</legend>
                    <div class="adjustments" role="toolbar" aria-label="Color Adjustments">
                        <div class="adjustment-row">
                            <label for="brightness">Brightness:</label>
                            <input type="range" id="brightness" min="-100" max="100" value="0"
                                   aria-label="Brightness" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"/>
                        </div>
                        <div class="adjustment-row">
                            <label for="saturation">Saturation:</label>
                            <input type="range" id="saturation" min="-100" max="100" value="0"
                                   aria-label="Saturation" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0"/>
                        </div>
                        <div class="adjustment-row">
                            <label for="hue">Hue:</label>
                            <input type="range" id="hue" min="0" max="359" value="0" aria-label="Hue" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0"/>
                        </div>
                    </div>
                </fieldset>
            </section>
            
            <!-- Continue with other sections similarly -->
        </div>
    </section>
  </main>
  <script type="module" src="script.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/js/bootstrap.bundle.min.js"></script>
</body>
                                </html>
